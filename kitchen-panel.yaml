#===========================================================================#
#                                                                           #
# My Kitchen Panel                                                          #
#                                                                           #
# Built for an ESP32 WiFi Color Display Kit Grande by ThingPulse            #
# https://thingpulse.com/product/esp32-wifi-color-display-kit-grande/       #
#                                                                           #
# Font setup instructions:                                                  #
# https://esphome.io/cookbook/lvgl.html#mdi-icons-in-text                   #
#                                                                           # 
#===========================================================================#

esphome:
  name: "kitchen-panel"
  friendly_name: "kitchen-panel"
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"

esp32:
  board: esp32dev
  framework:
    type: arduino

#
# General Setup
# ===============

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key
  
  # Update connection status for diagnostic page
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.label.update:
              id: api_status_txt
              text: "Connected"
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.label.update:
              id: api_status_txt
              text: "Disconnected"

# Configure OTA update access
ota:
  - platform: esphome
    password: !secret ota_password

#
# Wifi and static ip
# ==================
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Manual ip
  manual_ip:
    static_ip: !secret static_ip
    gateway: !secret gateway
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Grande Fallback Hotspot"
    password: !secret wifi_password

captive_portal:

#
# Display configuration
# =====================

i2c:
  sda: 23
  scl: 22
  scan: true

spi:
  clk_pin: 5
  mosi_pin: 18
  miso_pin: 19

output:
  - platform: ledc
    pin: 32
    id: gpio_backlight_pwm

display:
  - platform: ili9xxx
    id: CKG
    model: ILI9488_A
    cs_pin: 15
    dc_pin: 2
    reset_pin: 4
    auto_clear_enabled: false
    invert_colors: false
    transform:
      # Portrait mode
      #swap_xy: false
      #mirror_x: true
      #mirror_y: false
      
      # Landscape mode. Switch at bottom
      #swap_xy: true 
      #mirror_x: false 
      #mirror_y: false

      # Landsacpe mode. Switch at top
      swap_xy: true
      mirror_x: true
      mirror_y: true

    dimensions:
      # Portrait mode
      #width: 320 
      #height: 480 

      # Landsacpe mode
      width: 480 
      height: 320 
      
      offset_height: 0
      offset_width: 0

touchscreen:
  - platform: ft63x6
    interrupt_pin: 27
    display: CKG
    id: touch
    transform: 
      # Portrait mode
      #swap_xy: false
      #mirror_x: false
      #mirror_y: false
      
      # Landscape mode. Switch at bottom
      #swap_xy: true
      #mirror_x: true
      #mirror_y: false 

      # Landsacpe mode. Switch at top
      swap_xy: true
      mirror_x: false
      mirror_y: true

    on_touch:
      - logger.log:
          format: Touch %d at (%d, %d)
          args: [touch.id, touch.x, touch.y] 
    on_release: # resume from screen saver
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "LVGL resuming"
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: back_light

# Configure the  backlight
light:
  - platform: monochromatic
    id: back_light
    output: gpio_backlight_pwm
    name: "Display Backlight"
    restore_mode: ALWAYS_ON

# Define a screen timeout and make availalbe in HA
number:
  - platform: template
    id: display_timeout
    name: LVGL Screen timeout
    optimistic: true
    unit_of_measurement: "s"
    initial_value: 45
    restore_value: true
    min_value: 10
    max_value: 180
    step: 5
    mode: box

#
# Numeric sensors
# ===============
sensor:

  # Total amount charged today (negative = profit!)
  - platform: homeassistant
    id: total_charged_ha
    entity_id: sensor.total_charged
    on_value:
      - lvgl.label.update:
          id: total_charged_txt
          text:
            format: "Today: $%.2f"
            args: [ 'x' ]  

  # Amount of kW being generated by the solar panels
  - platform: homeassistant
    id: current_production_ha
    entity_id: sensor.envoy_current_power_production
    on_value:
      - lvgl.label.update:
          id: current_power_production_txt
          text:
            format: "%.2f"
            args: [ 'x' ]
      # If any solar being producted then show line from solar to house
      - if:
          condition:
            lambda: 'return id(current_production_ha).state > 0;'
          then:
            # Show line
            - lvgl.widget.update:
                id: solar_to_house_ln
                hidden: false
            - lvgl.widget.update:
                id: solar_to_house_lbl
                hidden: false
          else:
            # hide line
            - lvgl.widget.update:
                id: solar_to_house_ln
                hidden: true
            - lvgl.widget.update:
                id: solar_to_house_lbl
                hidden: true
      # If solar production is greater than consumption then show line from solar to grid
      - if:
          condition:
            lambda: 'return id(current_production_ha).state > id(current_power_consumption_ha).state;'
          then:
            # Show line
            - lvgl.widget.update:
                id: solar_to_grid_ln
                hidden: false
            - lvgl.widget.update:
                id: solar_to_grid_lbl
                hidden: false
          else:
            # hide line
            - lvgl.widget.update:
                id: solar_to_grid_ln
                hidden: true
            - lvgl.widget.update:
                id: solar_to_grid_lbl
                hidden: true
  
  # Amount of kW going into (negative value) or out of (postive value) the grid
  - platform: homeassistant
    id: current_net_power_consumption_ha
    entity_id: sensor.envoy_current_net_power_consumption
    on_value:
      - lvgl.label.update:
          id: current_net_power_consumption_txt
          text:
            format: "%.2f"
            args: [ 'x' ]
      - if:
          condition:
            lambda: 'return id(current_net_power_consumption_ha).state > 0;'
          then:
            # Show line
            - lvgl.widget.update:
                id: grid_to_house_ln
                hidden: false
            - lvgl.widget.update:
                id: grid_to_house_lbl
                hidden: false
          else:
            # hide line
            - lvgl.widget.update:
                id: grid_to_house_ln
                hidden: true
            - lvgl.widget.update:
                id: grid_to_house_lbl
                hidden: true

  # Amount of kW being consumed by the house
  - platform: homeassistant
    id: current_power_consumption_ha
    entity_id: sensor.envoy_current_power_consumption
    on_value:
      - lvgl.label.update:
          id: current_power_consumption_txt
          text:
            format: "%.2f"
            args: [ 'x' ]

  # Current usage
  - platform: homeassistant
    id: grid_current_usage_ha
    entity_id: sensor.energy_grid_current_usage
    on_value:
      - lvgl.indicator.update:
          id: grid_current_usage_val
          value: !lambda return x;
      - lvgl.label.update:
          id: grid_current_usage_txt
          text:
            format: "%.2f kW"
            args: [ 'x' ]

  # Hot tub set temp text value
  - platform: homeassistant
    id: hot_tub_set_temp_ha
    entity_id: number.smartlink_spanet_water_heater_set_temperature
    on_value:
      - lvgl.label.update:
          id: hot_tub_set_temp_txt
          text:
            format: "%.1f °C"
            args: [ 'x' ] 
      - lvgl.bar.update:
          id: hot_tub_set_temp_bar
          value: !lambda return x;

  # Hot tub current temp text value
  - platform: homeassistant
    id: hot_tub_current_temp_ha
    entity_id: sensor.smartlink_spanet_water_temperature
    on_value:
      - lvgl.label.update:
          id: hot_tub_current_temp_txt
          text:
            format: "%.1f °C"
            args: [ 'x' ] 
      - lvgl.bar.update:
          id: hot_tub_current_temp_bar
          value: !lambda return x;

  # Wifi signal
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    id: wifi_signal_sy
    update_interval: 60s
    on_value:
      - lvgl.label.update:
          id: wifi_signal_strength_txt
          text:
            format: "%.0f dBm"
            args: [ 'x' ] 

  # UV Now
  - platform: homeassistant
    id: arpansa_uv_melbourne_ha
    entity_id: sensor.arpansa_uv_melbourne
    on_value:
      - lvgl.indicator.update:
          id: arpansa_uv_melbourne_val
          value: !lambda return x;
      - lvgl.label.update:
          id: arpansa_uv_melbourne_txt
          text:
            format: "%.1f"
            args: [ 'x' ]

#
# Binary sensors to load from HA
# ==============================
binary_sensor:
  
  # Spare room switch
  - platform: homeassistant
    id: spare_room_ha
    entity_id: switch.spare_room
    publish_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: spare_room_btn
          state:
            checked: !lambda return x;

  # Sitting room light
  - platform: homeassistant
    id: front_room_ha
    entity_id: light.front_room
    publish_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: sitting_room_btn
          state:
            checked: !lambda return x;
  
  # Library light
  - platform: homeassistant
    id: library_ha
    entity_id: light.library
    publish_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: library_light_btn
          state:
            checked: !lambda return x;

  # Festoon lights
  - platform: homeassistant
    id: dimezy_light_ha
    entity_id: light.dimezy_light
    publish_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: festoon_light_btn
          state:
            checked: !lambda return x;

  # Hot tub heat pump
  - platform: homeassistant
    id: heat_pump_ha
    entity_id: binary_sensor.smartlink_spanet_heating_led
    publish_initial_state: true
    on_state:
      # If heat is off, set to red, else green
      - if:
          condition:
            binary_sensor.is_off: heat_pump_ha
          then:
            # Set led to red
              - lvgl.led.update:
                  id: heat_pump_ld
                  color: 0xFF0000
          else:
            # set led to green
              - lvgl.led.update:
                  id: heat_pump_ld
                  color: 0x00FF00

#
# Text sensors to load from HA
# ============================
text_sensor:
  
  # Current tariff
  - platform: homeassistant
    id: current_tariff_ha
    entity_id: input_text.current_tariff
    on_value:
      - lvgl.label.update:
          id: current_tariff_txt
          text: 
            format: "Tariff: %s" 
            args: [ 'id(current_tariff_ha).state.c_str()' ] 

  # Hot tub status
  - platform: homeassistant
    id: spanet_status_ha
    entity_id: sensor.smartlink_spanet_status
    on_value:
      - lvgl.label.update:
          id: hot_tub_status_txt
          text: 
            format: "%s"
            args: [ 'id(spanet_status_ha).state.c_str()' ] 

  # Wifi Details
  - platform: wifi_info
    ip_address:
      name: wifi_info_sy
      address_0:
        id: ip_address_sy
        on_value:
        - lvgl.label.update:
            id: ip_address_txt
            text: 
              format: "%s"
              args: [ 'id(ip_address_sy).state.c_str()' ] 
    ssid:
      id: wifi_ssid_sy
      on_value:
        - lvgl.label.update:
            id: wifi_ssid_txt
            text: 
              format: "%s"
              args: [ 'id(wifi_ssid_sy).state.c_str()' ] 

#
# Define fonts
# ============
font:

  - file: "fonts/RobotoCondensed-Regular.ttf"
    id: robotto_48
    size: 48
    bpp: 4
  - file: "fonts/RobotoCondensed-Regular.ttf"
    id: roboto_22
    size: 22
    bpp: 4
    extras:
      - file: "fonts/materialdesignicons-webfont.ttf"
        glyphs: [
          "\U000F1A73", # mdi-solar-power-variant
          "\U000F0D3E", # mdi-transmission-tower
          "\U000F02DC", # mdi-home
          "\U000F0828", # mdi-hot-tub
          "\U000F1A44", # mdi-heat-pump-outline
          "\U000F08BB", # mdi-cog-outline
          ]
  - file: "fonts/RobotoCondensed-Regular.ttf"
    id: robotto_20
    size: 20
    bpp: 4
  - file: "fonts/RobotoCondensed-Regular.ttf"
    id: robotto_18
    size: 18
    bpp: 4

#
# Graphics handling
# =================
lvgl:
  
  log_level: INFO
  color_depth: 16
  bg_color: 0x1c1c1c
  

  # Turn off screen when idle
  on_idle:
    timeout: !lambda "return (id(display_timeout).state * 1000);"
    then:
      - logger.log: "LVGL is idle"
      - light.turn_off: back_light
      - lvgl.pause:
  
  # Theme definition
  theme:
    label:
      text_font: roboto_22
      text_color: 0xFFFFFF
    button:
      text_font: roboto_22
      scroll_on_focus: true
      radius: 20
      pad_all: 0
      shadow_width: 0
      bg_color: 0x0C7B5F
      text_color: 0xB6B6B6
      checked:
        bg_color: 0xCC5E14
        text_color: 0xB6B6B6
      checkable: true

  # Define the common page content
  top_layer:
    widgets:
        - button: 
            height: 30
            width: 100
            align: bottom_mid
            checkable: false
            widgets:
            - label:
                align: center
                text: "Page"
            on_click:
             then:
                lvgl.page.next

  # Display Pages
  pages:

    # Main Page - Energy usage
    - id: main_page
      widgets:

        # Solar
        - label:
            align: TOP_MID
            y: +8
            text_font: robotto_18
            text_color: 0x0C7B5F
            text: "Solar"
        - obj:
            height: 100
            width: 100
            radius: 50
            align: TOP_MID
            y: +35
            border_width: 5
            border_color: 0x0C7B5F
            bg_color: 0x1C1C1C
            pad_all: 3
            widgets:
              - label:
                  align: TOP_MID
                  text: "\U000F1A73"
                  text_color: 0xFFFFFF 
              - label:
                  id: current_power_production_txt
                  align: CENTER
                  text_color: 0xFFFFFF 
              - label:
                  align: bottom_MID
                  text: "kW"
                  text_font: robotto_18
                  text_color: 0xFFFFFF
              
        # Grid
        - label:
            align: left_mid
            x: +44
            y: -32
            text_font: robotto_18
            text_color: 0xffffff
            text: "Grid"
        - obj:
            height: 100
            width: 100
            radius: 50
            align: left_mid
            x: +10     
            y: +35
            border_width: 5
            border_color: 0xffffff
            bg_color: 0x1C1C1C
            pad_all: 3
            widgets:
              - label:
                  align: TOP_MID
                  text: "\U000F0D3E"
                  text_color: 0xFFFFFF
              - label:
                  id: current_net_power_consumption_txt
                  align: CENTER
                  text_color: 0xFFFFFF
              - label:
                  align: bottom_MID
                  text: "kW"
                  text_font: robotto_18
                  text_color: 0xFFFFFF
        
        # House
        - label:
            align: right_mid
            x: -38
            y: -32
            text_font: robotto_18
            text_color: 0xCC5E14
            text: "House"
        - obj:
            height: 100
            width: 100
            radius: 50
            align: right_mid
            x: -10
            y: +35
            border_width: 5
            border_color: 0xCC5E14
            bg_color: 0x1C1C1C
            pad_all: 3
            widgets:
              - label:
                  align: TOP_MID
                  text: "\U000F02DC"
                  text_color: 0xFFFFFF
              - label:
                  id: current_power_consumption_txt
                  align: center
                  text_color: 0xFFFFFF 
              - label:
                  align: bottom_MID
                  text: "kW"
                  text_font: robotto_18
                  text_color: 0xFFFFFF

        # Solar to grid line:
        - line:
            id: solar_to_grid_ln
            points:
              - 215, 127
              - 215, 190
              - 112, 190
            line_width: 3
            line_color: 0x0C7B5F
            line_rounded: false
        - label:
            id: solar_to_grid_lbl
            x: 110
            y: 181
            text_font: montserrat_16
            text_color: 0x0C7B5F
            text: "\uF053"

        # Solar to house line:
        - line:
            id: solar_to_house_ln
            points:
              - 265, 127
              - 265, 190
              - 370, 190
            line_width: 3
            line_color: 0x0C7B5F
            line_rounded: false
        - label:
            id: solar_to_house_lbl
            x: 361
            y: 181
            text_font: montserrat_16
            text_color: 0x0C7B5F
            text: "\uF054"

        # Grid to house line:
        - line:
            id: grid_to_house_ln
            points:
              - 102, 220
              - 375, 220
            line_width: 2
            line_color: 0xffffff
            line_rounded: false
        - label:
            id: grid_to_house_lbl
            x: 365
            y: 211
            text_font: montserrat_16
            text_color: 0xFFFFFF
            text: "\uF054"

        # Total Charged Label
        - label:
            id: total_charged_txt
            text_font: robotto_18
            align: bottom_left
            x: 370
            y: -10
            text_color: 0xFFFFFF

        # Current Tariff Label
        - label:
            id: current_tariff_txt
            text_font: robotto_18
            align: bottom_left
            x: 10
            y: -10
            text_color: 0xFFFFFF

    # Diagnostics
        
        # Button to open dialogue
        - button: 
            height: 60
            width: 60
            align: top_right
            checkable: false
            bg_color: 0x1c1c1c
            x: -10
            y: +10
            widgets:
              - label:
                  align: top_right
                  text: "\U000F08BB"
            on_click:
              - lvgl.obj.update:
                  id: diagnostic_obj
                  hidden: false
        # Dialogue
        - obj:
            id: diagnostic_obj
            height: 260
            width: 400
            radius: 50
            align: TOP_MID
            border_width: 5
            border_color: 0x0C7B5F
            bg_color: 0xffffff
            pad_all: 3
            hidden: true
            widgets:
              # Heading
              - label:
                  align: TOP_MID
                  text_color: 0x000000
                  text: "Diagnostic\n========="
              # API Status
              - label: 
                  align: top_left
                  x: +50
                  y: +60
                  text_color: 0x000000
                  text: "API Status"
              - label:
                  id: api_status_txt
                  align: top_left
                  x: +220
                  y: +60
                  text_color: 0x000000
              # Signal Strength
              - label: 
                  align: top_left
                  x: +50
                  y: +90
                  text_color: 0x000000
                  text: "Signal Strength"
              - label:
                  id: wifi_signal_strength_txt
                  x: +220
                  y: +90
                  text_color: 0x000000
              # IP Address
              - label: 
                  align: top_left
                  x: +50
                  y: +120
                  text_color: 0x000000
                  text: "IP Address"
              - label:
                  id: ip_address_txt
                  x: +220
                  y: +120
                  text_color: 0x000000
              # SSID
              - label: 
                  align: top_left
                  x: +50
                  y: +150
                  text_color: 0x00000
                  text: "SSID"
              - label:
                  id: wifi_ssid_txt
                  x: +220
                  y: +150
                  text_color: 0x000000
              # Close Button
              - button: 
                  height: 30
                  width: 100
                  align: bottom_mid
                  checkable: false
                  widgets:
                  - label:
                      align: center
                      text: "Close"
                  on_click:
                    - lvgl.obj.update:
                        id: diagnostic_obj
                        hidden: true

    # Energy Usage Page
    - id: energy_usage
    
      widgets:
        - obj:
            height: 300
            width: 300
            align: CENTER
            bg_color: 0x1c1c1c
            border_width: 0
            pad_all: 4
            widgets:
              - meter:
                  height: 100%
                  width: 100%
                  border_width: 0
                  bg_opa: TRANSP
                  align: CENTER
                  scales:
                    - range_from: -7
                      range_to: 5
                      angle_range: 180 # sets the total angle to 180 = starts mid left and ends mid right
                      ticks:
                        count: 0
                      indicators:
                        - line:
                            id: grid_current_usage_val
                            width: 8
                            color: 0xffffff
                            r_mod: 12 # sets line length by this much difference from the scale default radius
                            value: -2
                        - arc: # green
                            color: 0x00FF00
                            r_mod: 10 # radius difference from the scale default radius
                            width: 31
                            start_value: -7
                            end_value: -1
                        - arc: # yellow
                            color: 0xFFFF00
                            r_mod: 10
                            width: 31
                            start_value: -1
                            end_value: 0
                        - arc: # red
                            color: 0xff0000
                            r_mod: 10
                            width: 31
                            start_value: 0
                            end_value: 5
              - obj: # to cover the middle part of meter indicator line
                  height: 146
                  width: 146
                  radius: 73
                  align: CENTER
                  border_width: 0
                  bg_color: 0x1c1c1c
                  pad_all: 0
              - label: # gauge numeric indicator
                  id: grid_current_usage_txt
                  text_font: robotto_48
                  align: CENTER
                  y: -18
                  text: "0"
              - label: # gauge numeric indicator
                  align: CENTER
                  y: +20
                  text: "Energy Usage"

                      # Energy Usage Page
    # Weather Page
    - id: weather
    
      widgets:
        - obj:
            height: 300
            width: 300
            align: CENTER
            bg_color: 0x1c1c1c
            border_width: 0
            pad_all: 4
            widgets:
              - meter:
                  height: 100%
                  width: 100%
                  border_width: 0
                  bg_opa: TRANSP
                  align: CENTER
                  scales:
                    - range_from: 0
                      range_to: 14
                      angle_range: 180 # sets the total angle to 180 = starts mid left and ends mid right
                      ticks:
                        count: 0
                      indicators:
                        - line:
                            id: arpansa_uv_melbourne_val
                            width: 8
                            color: 0xffffff
                            r_mod: 12 # sets line length by this much difference from the scale default radius
                            value: -2
                        - arc: # low - greeen
                            color: 0x00FF00
                            r_mod: 10 # radius difference from the scale default radius
                            width: 31
                            start_value: 0
                            end_value: 2.5
                        - arc: # moderate - yellow
                            color: 0xFFFF00
                            r_mod: 10
                            width: 31
                            start_value: 2.5
                            end_value: 5.5
                        - arc: # high - orange
                            color: 0xffa500
                            r_mod: 10
                            width: 31
                            start_value: 5.5
